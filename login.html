<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin</title>
  <style>
    :root {
      --brown-900:#241610;
      --brown-800:#332116;
      --brown-700:#4A3020;
      --brown-600:#6B4630;
      --brown-500:#8B5E3C;
      --brown-200:#EAD9C5;
      --brown-100:#F6EDE3;
      --cream:#FDF9F4;
      --accent:#C0803C;
      --shadow: 0 18px 40px rgba(56,35,22,.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at top, #fef7f0, #f6efe7 40%, #f3ebdf 100%);
      color: var(--brown-900);
    }

    .login-box {
      width: min(92vw, 420px);
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--brown-200);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 30px 24px;
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-badge {
      width: 62px;
      height: 62px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--brown-600), var(--brown-800));
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.7rem;
      color: var(--brown-800);
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--brown-500);
      font-size: .88rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 700;
      color: var(--brown-700);
      margin-bottom: 7px;
      letter-spacing: .5px;
    }

    input {
      width: 100%;
      border: 1.5px solid var(--brown-200);
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      transition: .18s ease;
    }

    input:focus {
      border-color: var(--brown-500);
      box-shadow: 0 0 0 4px rgba(139,94,60,.12);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: .96rem;
      font-weight: 800;
      cursor: pointer;
      transition: .2s ease;
      background: linear-gradient(145deg, var(--brown-600), var(--brown-800));
      color: #fff;
      box-shadow: 0 10px 22px rgba(74,48,32,.25);
    }

    .btn:hover { transform: translateY(-1px); }

    .link-back {
      display: block;
      margin-top: 16px;
      text-align: center;
      font-size: .82rem;
      color: var(--brown-600);
      text-decoration: none;
    }

    .message {
      min-height: 20px;
      margin-top: 12px;
      font-size: .8rem;
      color: var(--brown-600);
      text-align: center;
    }

    .message.error { color: #b0392f; }
    .message.success { color: #2e6b3d; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">
      <div class="brand-badge">A</div>
      <h1>Admin Login</h1>
      <p>Prista Store</p>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Masukkan username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Masukkan password" required />
      </div>

      <button class="btn" type="submit">Masuk ke Admin</button>
      <div id="message" class="message"></div>
    </form>

    <a class="link-back" href="index.html">← Kembali ke halaman utama</a>
  </div>

  <script>
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'prista123';

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const message = document.getElementById('message');

      if (username === ADMIN_USER && password === ADMIN_PASS) {
        localStorage.setItem('pristaAdminLoggedIn', 'true');
        localStorage.setItem('pristaAdminName', username);
        message.textContent = 'Login berhasil...';
        message.className = 'message success';
        window.location.href = 'admin.html';
      } else {
        message.textContent = 'Username atau password salah.';
        message.className = 'message error';
      }
    });
  </script>
</body>
</html>
